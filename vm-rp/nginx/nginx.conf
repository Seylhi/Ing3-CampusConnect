events {}
http {
  log_format sirius '$remote_addr -> "$request" -> $upstream_addr [$status]';
  access_log /dev/stdout sirius;
  server {
    listen 80;
    location /api/acces/ {
      proxy_pass http://10.20.10.12:8081/;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
    location / {
      default_type text/plain;
      return 200 "SIRIUS - reverse proxy OK\n";
    }
  }
}
