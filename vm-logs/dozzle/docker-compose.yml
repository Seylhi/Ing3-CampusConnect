services:
  dozzle:
    image: amir20/dozzle:latest
    container_name: dozzle
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      # agents des VM qui font tourner des conteneurs, joints par le VLAN ADMIN
      DOZZLE_REMOTE_AGENT: 10.20.30.10:7007,10.20.30.12:7007,10.20.30.13:7007,10.20.30.14:7007,10.20.30.20:7007
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - dozzle-data:/data   # comptes et parametres de Dozzle
volumes:
  dozzle-data:
